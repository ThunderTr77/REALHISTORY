<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>🏆 Bảng Xếp Hạng</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d0000 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      padding: 30px 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 3px solid #ffd700;
      border-radius: 20px;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
    }
    
    .header::before {
      content: '🏆';
      position: absolute;
      font-size: 150px;
      opacity: 0.1;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    
    .header h1 {
      font-size: 42px;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      position: relative;
      z-index: 1;
    }
    
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
      position: relative;
      z-index: 1;
    }
    
    .stat-item {
      text-align: center;
      padding: 15px 25px;
      background: rgba(255, 215, 0, 0.1);
      border: 2px solid #ffd700;
      border-radius: 10px;
    }
    
    .stat-item .label {
      font-size: 14px;
      color: #ffd700;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    
    .stat-item .value {
      font-size: 28px;
      font-weight: bold;
      color: #fff;
    }
    
    .form-section {
      background: rgba(0, 0, 0, 0.7);
      border: 3px solid #ffd700;
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 40px;
    }
    
    .form-section h2 {
      font-size: 28px;
      color: #ffd700;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      font-size: 18px;
      color: #ffd700;
      margin-bottom: 10px;
      font-weight: bold;
    }
    
    .form-group input {
      width: 100%;
      padding: 15px 20px;
      font-size: 18px;
      border: 3px solid #ffd700;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      outline: none;
      transition: all 0.3s;
    }
    
    .form-group input:focus {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      transform: translateY(-2px);
    }
    
    .submit-btn {
      width: 100%;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      color: #000;
      background: linear-gradient(135deg, #ffd700 0%, #ffa500 100%);
      border: 3px solid #ffd700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
    }
    
    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
    }
    
    .submit-btn:disabled {
      background: #666;
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    .leaderboard-section {
      background: rgba(0, 0, 0, 0.7);
      border: 3px solid #ffd700;
      border-radius: 20px;
      padding: 40px;
    }
    
    .leaderboard-section h2 {
      font-size: 28px;
      color: #ffd700;
      text-align: center;
      margin-bottom: 30px;
      text-transform: uppercase;
    }
    
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .leaderboard-table thead {
      background: rgba(255, 215, 0, 0.2);
    }
    
    .leaderboard-table th {
      padding: 15px;
      text-align: left;
      font-size: 16px;
      color: #ffd700;
      text-transform: uppercase;
      border-bottom: 3px solid #ffd700;
    }
    
    .leaderboard-table th:first-child {
      width: 80px;
      text-align: center;
    }
    
    .leaderboard-table th:nth-child(3) {
      width: 150px;
      text-align: center;
    }
    
    .leaderboard-table th:nth-child(4) {
      width: 200px;
    }
    
    .leaderboard-table td {
      padding: 12px 15px;
      font-size: 16px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
    }
    
    .leaderboard-table tr:hover {
      background: rgba(255, 215, 0, 0.1);
      transform: scale(1.01);
      transition: all 0.3s;
    }
    
    .rank-cell {
      text-align: center;
      font-weight: bold;
      font-size: 20px;
    }
    
    .rank-1 { 
      color: #FFD700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }
    .rank-2 { 
      color: #C0C0C0;
      text-shadow: 0 0 10px rgba(192, 192, 192, 0.8);
    }
    .rank-3 { 
      color: #CD7F32;
      text-shadow: 0 0 10px rgba(205, 127, 50, 0.8);
    }
    
    .score-cell {
      text-align: center;
      font-weight: bold;
      font-size: 20px;
      color: #ffd700;
    }
    
    .message {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 16px;
    }
    
    .error {
      background: rgba(220, 20, 60, 0.3);
      border: 2px solid #dc143c;
      color: #fff;
    }
    
    .success {
      background: rgba(76, 175, 80, 0.3);
      border: 2px solid #4caf50;
      color: #fff;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
      color: #ffd700;
    }
    
    .back-btn {
      display: block;
      width: 200px;
      margin: 30px auto;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: rgba(255, 107, 107, 0.9);
      border: 3px solid #ffd700;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      text-decoration: none;
    }
    
    .back-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.5);
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 28px;
      }
      
      .stats-bar {
        flex-direction: column;
        gap: 15px;
      }
      
      .form-section, .leaderboard-section {
        padding: 25px;
      }
      
      .leaderboard-table {
        font-size: 14px;
      }
      
      .leaderboard-table th,
      .leaderboard-table td {
        padding: 10px 8px;
        font-size: 13px;
      }
      
      .leaderboard-table th:nth-child(4),
      .leaderboard-table td:nth-child(4) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏆 BẢNG XẾP HẠNG 🏆</h1>
      <div class="stats-bar">
        <div class="stat-item">
          <div class="label">Điểm Của Bạn</div>
          <div class="value" id="yourScore">0</div>
        </div>
        <div class="stat-item">
          <div class="label">Màn Hoàn Thành</div>
          <div class="value" id="levelsCompleted">0/5</div>
        </div>
      </div>
    </div>
    
    <div class="form-section" id="formSection">
      <h2>🎖️ Ghi Danh Vào Lịch Sử</h2>
      <div id="message"></div>
      <form id="playerForm">
        <div class="form-group">
          <label for="playerName">
            <i class="fas fa-user"></i> Tên Chiến Sĩ:
          </label>
          <input 
            type="text" 
            id="playerName" 
            placeholder="Nhập tên của bạn (tối đa 30 ký tự)..." 
            maxlength="30"
            required
          />
        </div>
        
        <button type="submit" class="submit-btn" id="submitBtn">
          <i class="fas fa-trophy"></i> Ghi Danh
        </button>
      </form>
    </div>
    
    <div class="leaderboard-section">
      <h2>📊 Top Chiến Sĩ Xuất Sắc</h2>
      <div id="leaderboardContent">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu...
        </div>
      </div>
    </div>
    
    <a href="menu.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Quay Lại Menu
    </a>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, push, onValue, query, orderByChild } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    const firebaseConfig = {
        apiKey: "AIzaSyBcEwzMEXk6vR6QdwK5G9SO1fw7crXoTmM",
        authDomain: "lichsu-e6399.firebaseapp.com",
        databaseURL: "https://lichsu-e6399-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "lichsu-e6399",
        storageBucket: "lichsu-e6399.firebasestorage.app",
        messagingSenderId: "969830108608",
        appId: "1:969830108608:web:75e2c4a5f62cb1e9d80c25",
        measurementId: "G-EWYWNB5DNN"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const leaderboardRef = ref(database, 'leaderboard');

    const totalScore = parseInt(localStorage.getItem('totalScore') || '0');
    const completedLevels = JSON.parse(localStorage.getItem('completedLevels') || '[]');
    const gameCompleted = localStorage.getItem('gameCompleted') === 'true';
    const hasSubmitted = localStorage.getItem('leaderboardSubmitted') === 'true';
    
    document.getElementById('yourScore').textContent = totalScore;
    document.getElementById('levelsCompleted').textContent = `${completedLevels.length}/5`;
    
    if (!gameCompleted || completedLevels.length < 5) {
      document.getElementById('formSection').innerHTML = `
        <div class="message error">
          <h2>⚠️ Chưa Hoàn Thành Game</h2>
          <p>Bạn cần hoàn thành tất cả 5 màn!</p>
          <p>Đã hoàn thành: ${completedLevels.length}/5 màn</p>
          <p>Điểm hiện tại: ${totalScore}</p>
        </div>
      `;
    } else if (hasSubmitted) {
      document.getElementById('formSection').innerHTML = `
        <div class="message success">
          <h2>✅ Đã Ghi Danh Thành Công!</h2>
          <p>Điểm của bạn: <strong>${totalScore}</strong></p>
          <p>Xem vị trí của bạn ở bảng dưới đây! 👇</p>
        </div>
      `;
    }

    document.getElementById('playerForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const playerName = document.getElementById('playerName').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const messageDiv = document.getElementById('message');
      
      if (!playerName) {
        messageDiv.innerHTML = '<div class="message error">⚠️ Vui lòng nhập tên!</div>';
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang ghi danh...';
      
      try {
        await push(leaderboardRef, {
          name: playerName,
          score: totalScore,
          completedAt: Date.now(),
          timestamp: new Date().toISOString()
        });
        
        console.log('✅ Đã ghi vào Firebase thành công!');
        
        messageDiv.innerHTML = `
          <div class="message success">
            <i class="fas fa-check-circle"></i> 
            Chúc mừng <strong>${playerName}</strong>! 
            <br>Điểm số: <strong>${totalScore}</strong>
          </div>
        `;
        
        document.getElementById('playerForm').style.display = 'none';
        localStorage.setItem('leaderboardSubmitted', 'true');
        
      } catch (error) {
        console.error('❌ Lỗi khi ghi Firebase:', error);
        messageDiv.innerHTML = `
          <div class="message error">
            ❌ Lỗi: ${error.message}
          </div>
        `;
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-trophy"></i> Ghi Danh';
      }
    });

    function loadLeaderboard() {
      const leaderboardQuery = query(leaderboardRef, orderByChild('score'));
      
      onValue(leaderboardQuery, (snapshot) => {
        const data = snapshot.val();
        const leaderboardContent = document.getElementById('leaderboardContent');
        
        if (!data) {
          leaderboardContent.innerHTML = `
            <div class="loading">
              Chưa có ai ghi danh. Hãy là người đầu tiên! 🎖️
            </div>
          `;
          return;
        }
        
        const players = Object.entries(data)
          .map(([key, value]) => ({ id: key, ...value }))
          .sort((a, b) => b.score - a.score);
        
        let html = `
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th>Hạng</th>
                <th>Tên Chiến Sĩ</th>
                <th>Điểm</th>
                <th>Thời Gian Hoàn Thành</th>
              </tr>
            </thead>
            <tbody>
        `;
        
        players.forEach((player, index) => {
          const rank = index + 1;
          const rankClass = rank <= 3 ? `rank-${rank}` : '';
          const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
          const date = new Date(player.completedAt).toLocaleString('vi-VN', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
          
          html += `
            <tr>
              <td class="rank-cell ${rankClass}">
                ${medal} #${rank}
              </td>
              <td><strong>${player.name}</strong></td>
              <td class="score-cell">${player.score}</td>
              <td>${date}</td>
            </tr>
          `;
        });
        
        html += `
            </tbody>
          </table>
        `;
        
        leaderboardContent.innerHTML = html;
        
        console.log(`✅ Đã load ${players.length} người vào bảng xếp hạng`);
      }, (error) => {
        console.error('❌ Lỗi khi load leaderboard:', error);
        leaderboardContent.innerHTML = `
          <div class="message error">
            ❌ Không thể tải dữ liệu: ${error.message}
          </div>
        `;
      });
    }
    
    loadLeaderboard();
  </script>
</body>
</html>
