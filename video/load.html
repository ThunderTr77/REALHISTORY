<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Loading</title>
  
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html {
      width: 100%;
      height: 100%;
    }
    
    body {
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      width: 100%;
      height: 100%;
      position: fixed;
      touch-action: none;
      overscroll-behavior: none;
    }
    
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    
    #unmuteBtn {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: rgba(255, 215, 0, 0.95);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 50px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
      z-index: 1000;
      display: none;
      animation: pulse 1.5s infinite;
      user-select: none;
      min-width: 50px;
      min-height: 50px;
      touch-action: manipulation;
      will-change: transform;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    /* Màn hình rất nhỏ - phones portrait */
    @media (max-width: 425px) {
      body {
        height: 100dvh; /* Dynamic viewport height */
      }
      
      canvas {
        max-height: 100dvh;
      }
      
      #unmuteBtn {
        bottom: 8px;
        right: 8px;
        padding: 8px 15px;
        font-size: 18px;
        min-width: 42px;
        min-height: 42px;
      }
    }
    
    /* Extra small devices */
    @media (max-width: 375px) {
      #unmuteBtn {
        bottom: 5px;
        right: 5px;
        padding: 6px 12px;
        font-size: 16px;
        min-width: 38px;
        min-height: 38px;
      }
    }
    
    /* Landscape mode - màn hình ngang */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        height: 100dvh;
      }
      
      canvas {
        max-height: 100dvh;
      }
      
      #unmuteBtn {
        bottom: 5px;
        right: 5px;
        padding: 6px 12px;
        font-size: 16px;
        min-width: 38px;
        min-height: 38px;
      }
    }
  </style>
</head>
<body>

<audio id="tankSound" autoplay loop preload="auto">
  <source src="../sound/xechay.mp3" type="audio/mpeg">
</audio>

<button id="unmuteBtn" onclick="unmute()">🔊</button>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const tankSound = document.getElementById('tankSound');
const unmuteBtn = document.getElementById('unmuteBtn');


function getActualVH() {
  return window.innerHeight || document.documentElement.clientHeight;
}

function getActualVW() {
  return window.innerWidth || document.documentElement.clientWidth;
}


function resizeCanvas() {
  const vw = getActualVW();
  const vh = getActualVH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  
 
  canvas.width = vw * dpr;
  canvas.height = vh * dpr;
  
  ctx.scale(dpr, dpr);
  
  canvas.style.width = `${vw}px`;
  canvas.style.height = `${vh}px`;
}


let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    resizeCanvas();
    resetPositions();
  }, 100);
});

resizeCanvas();

// ========== AUDIO CONTROL ==========
tankSound.volume = 0.7;

tankSound.addEventListener('play', () => {
  console.log('✅ Âm thanh đang phát!');
  unmuteBtn.style.display = 'none';
});

tankSound.addEventListener('pause', () => {
  console.log('⚠️ Âm thanh bị pause!');
  unmuteBtn.style.display = 'block';
});

window.addEventListener('load', () => {
  tankSound.play().then(() => {
    console.log('✅ Autoplay thành công!');
  }).catch(err => {
    console.log('⚠️ Autoplay bị chặn, hiện nút unmute');
    unmuteBtn.style.display = 'block';
  });
});

function unmute() {
  tankSound.muted = false;
  tankSound.volume = 0.7;
  tankSound.play();
  unmuteBtn.style.display = 'none';
}

document.addEventListener('click', () => {
  if (tankSound.paused) {
    tankSound.play();
  }
}, { once: true });

function fadeOutSound(duration = 500) {
  const startVolume = tankSound.volume;
  const fadeStep = startVolume / (duration / 50);
  
  const fadeInterval = setInterval(() => {
    if (tankSound.volume > fadeStep) {
      tankSound.volume -= fadeStep;
    } else {
      tankSound.volume = 0;
      tankSound.pause();
      clearInterval(fadeInterval);
    }
  }, 50);
}

// =================================

const bgImage = new Image();
const tankVN = new Image();
const tankEnemy = new Image();

bgImage.src = '../image/bg.jpg';
tankVN.src = '../image/tank1.png';
tankEnemy.src = '../image/tank2.png';

let loaded = 0;

function onLoaded() {
  loaded++;
  if (loaded === 3) {
    startAnimation();
  }
}
bgImage.onload = onLoaded;
tankVN.onload = onLoaded;
tankEnemy.onload = onLoaded;

// --------- Trạng thái ----------
let tankH;
let tankVNPosX;
let tankEnemyPosX;
let collided = false;
let collisionFrame = 0;
let showQuestion = false;
let questionAlpha = 0;

const moveTime =2;
const fps = 60;
const framesToCollide = moveTime * fps;

let particles = [];
let planes = [];

// --------- MÁY BAY ----------
function getCanvasSize() {
  return {
    width: getActualVW(),
    height: getActualVH()
  };
}

function spawnPlane() {
  const size = getCanvasSize();
  const fromLeft = Math.random() < 0.5;
  const margin = size.width * 0.05;
  const startX = fromLeft ? -margin : size.width + margin;
  const endX = fromLeft ? size.width + margin : -margin;

  planes.push({
    fromLeft,
    startX,
    endX,
    y: size.height * (0.05 + Math.random() * 0.15),
    waveAmplitude: size.height * (0.015 + Math.random() * 0.025),
    waveFrequency: 2 + Math.random() * 2,
    t: 0,
    speed: 0.003 + Math.random() * 0.004
  });
}

function getPlanePos(startX, endX, baseY, amplitude, frequency, t) {
  const x = startX + (endX - startX) * t;
  const y = baseY + Math.sin(t * Math.PI * frequency) * amplitude;
  return { x, y };
}

function updatePlanes() {
  planes.forEach(p => { p.t += p.speed; });
  planes = planes.filter(p => {
    if (p.t > 1.05) {
      spawnPlane();
      return false;
    }
    return true;
  });
  while (planes.length < 4) spawnPlane();
}

function drawPlanes() {
  const size = getCanvasSize();
  const fontSize = Math.max(24, Math.min(size.width, size.height) * 0.06);
  
  ctx.save();
  ctx.font = `300 ${fontSize}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  planes.forEach(p => {
    const pos = getPlanePos(p.startX, p.endX, p.y, p.waveAmplitude, p.waveFrequency, p.t);
    
    const derivative = Math.cos(p.t * Math.PI * p.waveFrequency) * p.waveAmplitude * p.waveFrequency * Math.PI;
    const dx = p.endX - p.startX;
    const angle = Math.atan2(derivative, dx);
    
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate(angle);
    
    ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
    
    ctx.fillStyle = '#555';
    ctx.fillText('✈️', 0, 0);
    
    ctx.restore();
  });

  ctx.restore();
}

// --------- Hỗ trợ ----------
function resetPositions() {
  const size = getCanvasSize();
  tankH = size.height * (size.width < 425 ? 0.22 : 0.25);
  tankVNPosX = -tankH * 2;
  tankEnemyPosX = size.width + tankH * 2;
  collided = false;
  collisionFrame = 0;
  showQuestion = false;
  questionAlpha = 0;
  particles = [];
  planes = [];
  for (let i = 0; i < 4; i++) spawnPlane();
}

function spawnWarEffects(cx, cy) {
  particles = [];
  const size = getCanvasSize();
  const particleCount = Math.min(40, Math.floor(size.width / 15));
  
  for (let i = 0; i < particleCount; i++) {
    particles.push({
      x: cx,
      y: cy,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      size: 2 + Math.random() * 4,
      life: 60 + Math.random() * 40,
      type: Math.random() < 0.5 ? 'smoke' : 'spark'
    });
  }
}

function updateParticles() {
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.02;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
  particles.forEach(p => {
    if (p.type === 'smoke') {
      ctx.fillStyle = 'rgba(200,200,200,0.7)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,215,0,0.9)';
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
  });
}

function drawDust(x, y, scale) {
  ctx.fillStyle = 'rgba(139,69,19,0.4)';
  const dustCount = scale > 1 ? 7 : 5;
  for (let i = 0; i < dustCount; i++) {
    const dx = Math.random() * 50 * scale;
    const dy = Math.random() * 5 * scale;
    ctx.beginPath();
    ctx.ellipse(x - dx, y + dy, 6 * scale, 3 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawTank(img, x, y, shake) {
  const scale = tankH / 55;
  const w = 90 * scale;
  const h = tankH;

  if (shake) {
    const sx = (Math.random() * 8) - 4;
    const sy = (Math.random() * 8) - 4;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.drawImage(img, x, y, w, h);
    ctx.restore();
  } else {
    ctx.drawImage(img, x, y, w, h);
  }
  return { w, h };
}

function drawTankVN(x, y, shake) {
  const scale = tankH / 55;
  const w = 90 * scale;
  drawDust(x + w * 0.2, y + tankH * 0.95, scale);
  return drawTank(tankVN, x, y, shake);
}

function drawQuestionMark(cx, cy) {
  if (!showQuestion) return;
  if (questionAlpha < 1) questionAlpha += 0.05;

  ctx.save();
  ctx.globalAlpha = questionAlpha;

  const size = getCanvasSize();
  const markSize = Math.min(size.width, size.height) * (size.width < 425 ? 0.14 : 0.12);
  const radius = markSize * 0.85;

 
  const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.3);
  gradient.addColorStop(0, 'rgba(255, 235, 59, 0.6)');
  gradient.addColorStop(0.5, 'rgba(255, 152, 0, 0.3)');
  gradient.addColorStop(1, 'rgba(255, 152, 0, 0)');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 1.3, 0, Math.PI * 2);
  ctx.fill();


  ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
  ctx.shadowBlur = 15;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 6;
  
  const bgGradient = ctx.createRadialGradient(cx, cy - markSize * 0.2, 0, cx, cy, radius);
  bgGradient.addColorStop(0, 'rgba(255, 235, 59, 0.95)');
  bgGradient.addColorStop(1, 'rgba(255, 193, 7, 0.85)');
  ctx.fillStyle = bgGradient;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;


  ctx.strokeStyle = '#FF6F00';
  ctx.lineWidth = markSize * 0.08;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.stroke();

 
  ctx.font = `bold ${markSize * 1.2}px Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 3;

  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('?', cx, cy + markSize * 0.05);

  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#D84315';
  ctx.lineWidth = markSize * 0.04;
  ctx.strokeText('?', cx, cy + markSize * 0.05);

  ctx.restore();
}

// --------- ANIMATION ---------
function startAnimation() {
  resetPositions();
  
  const tankY = () => {
    const size = getCanvasSize();
    return size.height * 0.68;
  };

  function loop() {
    const size = getCanvasSize();
    ctx.clearRect(0, 0, size.width, size.height);
    ctx.drawImage(bgImage, 0, 0, size.width, size.height);

    updatePlanes();
    drawPlanes();

    const y = tankY();
    const scale = tankH / 55;
    const tankW = 90 * scale;

    if (!collided) {
      const distanceToMeet = size.width + tankW * 4;
      const step = distanceToMeet / framesToCollide;

      tankVNPosX += step / 2;
      tankEnemyPosX -= step / 2;

      const vn = drawTankVN(tankVNPosX, y, false);
      drawTank(tankEnemy, tankEnemyPosX, y, false);

      if (tankVNPosX + vn.w >= tankEnemyPosX) {
        collided = true;
        const cx = (tankVNPosX + tankEnemyPosX) / 2;
        const cy = y - tankH * 0.2;
        spawnWarEffects(cx, cy);
        showQuestion = true;
        fadeOutSound(500);
        console.log('💥 Va chạm! Tắt âm thanh');
      }
    } else {
      const shaking = collisionFrame < 15;
      drawTankVN(tankVNPosX, y, shaking);
      drawTank(tankEnemy, tankEnemyPosX, y, shaking);

      updateParticles();
      drawParticles();

      const cx = (tankVNPosX + tankEnemyPosX) / 2;
      const cy = y - tankH * 0.8;
      drawQuestionMark(cx, cy);

      collisionFrame++;
    }

    requestAnimationFrame(loop);
  }
  loop();
}


window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    resizeCanvas();
    resetPositions();
    window.scrollTo(0, 0);
  }, 100);
});


document.addEventListener('visibilitychange', () => {
  if (document.hidden && tankSound) {
    tankSound.pause();
  }
});


if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
  unmuteBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    unmuteBtn.style.transform = 'scale(0.9)';
  });
  
  unmuteBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    unmuteBtn.style.transform = 'scale(1)';
    unmute();
  });
  
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, false);
  
 
  document.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });
}


window.addEventListener('scroll', () => {
  window.scrollTo(0, 0);
});
</script>
</body>
</html>
